# .github/workflows/snyk-security.yml
# Nova Bank – Snyk security scans in CI (demo built on cgibbs-snyk/nodejs-interview)
#
# What it does – the RELEASE GATE (the GitHub integration's PR checks stay the developer gate)
#   • Every build   → `snyk test`   : fails on high/critical issues that have a fix.
#                                     Start report-only (SNYK_BLOCKING=false), then switch to true.
#                                     snyk test checks the whole project; for "new issues only" use
#                                     snyk-delta or time-limited ignores with a reason and expiry.
#   • Push to main  → `snyk monitor`: records what shipped in the owning team's Organization and
#                                     alerts the team on NEW vulnerabilities disclosed later.
#   • Every run     → `snyk code test` (SAST), report-only – first-party / AI-written code.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions)
#   Secret    SNYK_TOKEN                 Snyk auth token (service account token in production)
#   Variable  SNYK_ORG                   owning team's Organization slug or ID (from the ownership map)
#   Variable  SNYK_SEVERITY_THRESHOLD    lowest severity that blocks: high = high and critical (default: high)
#   Variable  SNYK_BLOCKING              true = issues above the threshold fail the build (default: true)
#                                        false = report only: use for the first days of each new pipeline

name: Snyk Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a run live from the Actions tab during the demo

permissions:
  contents: read

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }} # the CLI reads this automatically – no `snyk auth` step needed
  SNYK_ORG: ${{ vars.SNYK_ORG }}
  SEVERITY_THRESHOLD: ${{ vars.SNYK_SEVERITY_THRESHOLD || 'high' }}
  SNYK_BLOCKING: ${{ vars.SNYK_BLOCKING || 'true' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) RELEASE GATE – snyk test (runs on PRs, pushes to main and manual runs)
  # ---------------------------------------------------------------------------
  snyk-test:
    name: Snyk test (release gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # needed to publish SARIF results to the GitHub Security tab
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Snyk CLI
        run: |
          npm install --global snyk@latest
          snyk --version

      - name: Snyk test – open source dependencies
        run: |
          set +e
          snyk test \
            --org="$SNYK_ORG" \
            --severity-threshold="$SEVERITY_THRESHOLD" \
            --fail-on=upgradable \
            --json-file-output=snyk-results.json \
            --sarif-file-output=snyk-results.sarif
          rc=$?
          set -e

          # Snyk CLI exit codes: 0 = no issues, 1 = issues found,
          #                      2 = CLI error (e.g. auth), 3 = no supported project found
          if [ "$rc" -eq 1 ] && [ "$SNYK_BLOCKING" != "true" ]; then
            echo "::warning title=Snyk::Vulnerabilities found – report-only mode, build not blocked."
            exit 0
          fi
          exit "$rc"

      - name: Publish results to GitHub Security tab
        if: always() && hashFiles('snyk-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-results.sarif
          category: snyk-open-source

      - name: Build HTML report
        if: always() && hashFiles('snyk-results.json') != ''
        run: npx --yes snyk-to-html -i snyk-results.json -o snyk-report.html

      - name: Upload report as build artifact
        if: always() && hashFiles('snyk-report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: snyk-open-source-report
          path: snyk-report.html

  # ---------------------------------------------------------------------------
  # 2) RECORD WHAT SHIPPED – snyk monitor (only for code that reached main)
  #    Separate job with no `needs:` → it still runs when the gate fails, so the
  #    Snyk UI always reflects what is actually on main.
  # ---------------------------------------------------------------------------
  snyk-monitor:
    name: Snyk monitor (record what shipped)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Snyk CLI
        run: npm install --global snyk@latest && snyk --version

      - name: Snyk monitor – record release snapshot with labels
        run: |
          snyk monitor \
            --org="$SNYK_ORG" \
            --target-reference="${{ github.ref_name }}" \
            --project-environment=backend,external \
            --project-lifecycle=production \
            --project-business-criticality=critical
          # Optional, Enterprise plan – extra labels (ownership itself comes from the team's Organization):
          #   --project-tags=team=payments,owner=payments-champion,app=nova-payments-api

  # ---------------------------------------------------------------------------
  # 3) FIRST-PARTY / AI-WRITTEN CODE – snyk code test (SAST), report-only for now
  #    Requires Snyk Code to be enabled: Snyk → Settings → Snyk Code → Enable.
  #    (`snyk monitor` is not supported for Snyk Code.)
  # ---------------------------------------------------------------------------
  snyk-code:
    name: Snyk Code (SAST, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Snyk CLI
       run: npm install --global snyk@latest && snyk --version
      - name: Snyk code test
        run: snyk code test --org="$SNYK_ORG" --severity-threshold=high
